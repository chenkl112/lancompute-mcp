[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lancompute-mcp"
version = "0.1.0"
description = "Run persistent compute jobs on your Windows or Linux computer through MCP over SSH."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.12,<2", "psutil>=5.9,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
lancompute-mcp = "lancompute_mcp.server:main"

[project.urls]
Repository = "https://github.com/chenkl112/lancompute-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/lancompute_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
